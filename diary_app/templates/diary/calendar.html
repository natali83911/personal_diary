{% extends "base.html" %}

{% block title %}Календарь{% endblock %}

{% block content %}
<h1>Календарь {{ month }}/{{ year }}</h1>

<div class="mb-3">
  <a href="{% url 'diary:calendar_filtered' prev_year prev_month %}" class="btn btn-outline-success">&laquo; Предыдущий</a>
  <a href="{% url 'diary:calendar_filtered' next_year next_month %}" class="btn btn-outline-success ms-2">Следующий &raquo;</a>
</div>

<div>
  {{ calendar|safe }}
</div>

<style>
  table {
    width: 100%;
    border-collapse: collapse;
  }
  th, td {
    border: 1px solid #ced4da;
    padding: 8px;
    text-align: center;
  }
  th {
    background-color: #e9ecef;
  }
  td {
    height: 80px;
    vertical-align: top;
  }
  /* Опционально для текущего дня */
  .today {
    background-color: #c3e6cb;
  }
</style>
{% endblock %}
