{% extends "base.html" %}

{% block title %}Список пользователей{% endblock %}

{% block content %}
<h1>Список пользователей</h1>

<table class="table">
  <thead>
    <tr>
      <th>Email</th>
      <th>Аватар</th>
      <th>Действия</th>
    </tr>
  </thead>
  <tbody>
    {% for user in object_list %}
    <tr>
      <td>{{ user.email }}</td>
      <td>
        {% if user.avatar %}
          <img src="{{ user.avatar.url }}" alt="Аватар {{ user.email }}" width="50" />
        {% else %}
          Нет аватара
        {% endif %}
      </td>
      <td>
        <a href="{% url 'users:user_detail' user.pk %}">Просмотр</a> |
        <a href="{% url 'users:user_update' user.pk %}">Редактировать</a>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
